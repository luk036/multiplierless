# This file is used to configure your project.
# Read more about the various options under:
# http://setuptools.readthedocs.io/en/latest/setuptools.html#configuring-setup-using-setup-cfg-files

[metadata]
name = multiplierless
description = Multiplierless (CSD) FIR filter design
author = Wai-Shing Luk
author_email = luk036@gmail.com
license = MIT
license_files = LICENSE
long_description = file: README.md
long_description_content_type = text/markdown; charset=UTF-8; variant=GFM
url = https://github.com/luk036/multiplierless
project_urls =
    Documentation = https://multiplierless.readthedocs.io/en/latest/
    Source = https://github.com/luk036/multiplierless
    Changelog = https://github.com/luk036/multiplierless/blob/main/CHANGELOG.md
    Tracker = https://github.com/luk036/multiplierless/issues

platforms = any

classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Science/Research
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Topic :: Scientific/Engineering


[options]
zip_safe = False
packages = find_namespace:
include_package_data = True
package_dir =
    =src

python_requires = >=3.10

install_requires =
    numpy>=1.12.0
    csdigit @ git+https://github.com/luk036/csdigit.git@2562cd1e676fd768120cf336f77a26fd7a168aad
    ellalgo @ git+https://github.com/luk036/ellalgo.git@bab79840a281c161baa8fa50151d85445e202f4e
    ginger @ git+https://github.com/luk036/ginger.git@3fbbaf0fadfc1fd9849ac79fc2ad9bb8511558cb


[options.packages.find]
where = src
exclude =
    tests

[options.extras_require]
# Add here additional requirements for extra features, to install with:
# `pip install multiplierless[PDF]` like:
# PDF = ReportLab; RXP

# Add here test requirements (semicolon/line-separated)
testing =
    setuptools
    hypothesis
    pytest
    pytest-cov
    pytest-benchmark
    numpy
    black
    flake8
    isort
    mypy

sim =
    cocotb>=2.0

[options.entry_points]
console_scripts =
    fir-design = multiplierless.fir_design:main

[tool:pytest]
# Specify command line options as you would do when invoking pytest directly.
# e.g. --cov-report html (or xml) for html/xml output or --junitxml junit.xml
# in order to write a coverage file that can be read by Jenkins.
# CAUTION: --cov flags may prohibit setting breakpoints while debugging.
#          Comment those flags to avoid this py.test issue.
addopts =
    --cov multiplierless --cov-report term-missing
    --verbose
norecursedirs =
    dist
    build
    .tox
    .git
    .hypothesis
    .mypy_cache
    .ruff_cache
    __pycache__
testpaths = tests
# Use pytest markers to select/deselect specific tests
# markers =
#     slow: mark tests as slow (deselect with '-m "not slow"')
#     system: mark end-to-end system tests

[bdist_wheel]
# Use this option if your package is pure-python
universal = 1

[devpi:upload]
# Options for the devpi: PyPI server and packaging tool
# VCS export must be deactivated since we are using setuptools-scm
no_vcs = 1
formats = bdist_wheel

[flake8]
# Some sane defaults for the code style checker flake8
max_line_length = 88
extend_ignore = E203, W503
# ^  Black-compatible
#    E203 and W503 have edge cases handled by black
exclude =
    .tox
    build
    dist
    .eggs
    docs/conf.py

[pyscaffold]
# PyScaffold's parameters when the project was created.
# This will be used when updating. Do not change!
version = 4.0.2
package = multiplierless
extensions =
    markdown
    pre_commit
